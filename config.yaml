system:
  log_level: "INFO"      # DEBUG floods the Pi SD card / journal

cameras:
  dms:
    source: "picamera"   # Pi CSI camera (imx708 NoIR) — driver-facing, works with IR at night
    width: 640
    height: 480
    fps: 20
  road:
    source: "/dev/v4l/by-id/usb-00004000_P040200_SN0002_1080P_Web_Camera_00004000_P040200_SN0002-video-index0"   # USB webcam (road-facing); stable path, /dev/videoN changes between boots
    width: 640
    height: 480
    fps: 20

dms:
  backend: "mediapipe"
  ear:
    threshold: 0.30       # pre-calibration fallback; auto-cal overrides this
    consec_frames: 13     # 13 fr @ 20fps = 650ms sustained closure -> DROWSY
  mar:
    threshold: 0.50       # corrected 6-pt MAR scale
    consec_frames: 8      # 8 fr @ 20fps = 400ms sustained yawn -> FATIGUED
  head_pose:
    yaw_limit: 30
    pitch_limit: 20
    consec_frames: 5      # 5 fr @ 20fps = 250ms
  weights:
    ear: 0.45
    mar: 0.25
    head: 0.30
  low_light:
    enabled: true
    brightness_threshold: 60   
    clahe_clip: 2.0
    clahe_grid: 8

road:
  model_path: "models/yolov8n_rdd_india_ncnn_model"
  confidence_threshold: 0.50     # used when per_class_thresholds is false (paper benchmarks)
  iou_threshold: 0.35            # NEW: tighter NMS -> fewer duplicate boxes
  per_class_thresholds: true     # NEW: runtime per-class conf (pothole 0.35 ... repair 0.55)
  temporal_confirmation: true    # NEW: require a hazard across several frames before it counts
  confirm_frames: 2              # must appear in at least this many (halved for 15fps + skip)
  confirm_window: 4              # ...of the last this-many frames
  classes:
    0: "pothole"
    1: "crack_longitudinal"
    2: "crack_transverse"
    3: "rutting"
    4: "repair"
  severity:
    minor:
      area_px2_max: 3000
    moderate:
      area_px2_max: 10000

gps:
  enabled: true
  simulation: true
  port: "/dev/serial0"   # Pi GPIO UART (pins 8/10); use /dev/ttyUSB0 or /dev/ttyACM0 for a USB GPS
  baudrate: 9600         # FIXED: was 'baud' — gps_reader.py expects 'baudrate'
  timeout: 1.0

# ── NEW: Predictive proximity alert ───────────────────────
proximity_alert:
  radius_metres: 80        # warn when hazard within this distance
  ahead_degrees: 70        # +/- heading tolerance to count as "ahead"
  cooldown_seconds: 4      # min seconds between same-hazard alerts
  display_seconds: 6       # how long alert stays on dashboard
  osm_enabled: true        # Layer 2: OpenStreetMap road surface check
  osm_cooldown_s: 30       # query OSM at most every N seconds
  min_speed_kmh: 3.0       # don't alert when parked

# ── NEW: Dual-channel voice alerts ────────────────────────
voice_alert:
  enabled: true
  rate_normal: 148         # words per minute (normal tier)
  rate_severe: 205         # faster for severe alerts (risk >= 70%)
  volume_normal: 0.9
  volume_severe: 1.0
  cooldown_driver: 10.0    # seconds between driver alerts
  cooldown_road: 6.0       # seconds between road alerts
  cooldown_severe: 7.0     # seconds between severe alerts

alert:
  buzzer_gpio_pin: null
  audio_alert: false
  dashboard_host: "0.0.0.0"
  dashboard_port: 5000
  risk_levels:
    low: 0.35
    moderate: 0.65
  speed_risk:
    enabled: true
    low_speed_kmh: 40      # at/below this: no amplification
    high_speed_kmh: 80     # at/above this: full amplification
    max_factor: 1.35       # risk multiplier at high speed

database:
  path: "data/logs/driver_guard_events.db"
  flush_interval_sec: 5      
  max_rows_per_table: 50000
